<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d0d14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MindFlow">
<title>MindFlow Local</title>
<style>
:root {
  --bg:#0d0d14;--s1:#14141f;--s2:#1c1c2a;--s3:#242436;--border:#2d2d45;
  --accent:#6c63ff;--accent2:#9d97ff;--adim:rgba(108,99,255,.14);
  --text:#e4e4f0;--text2:#8888a8;--text3:#4a4a6a;
  --danger:#ff6b6b;--warn:#ffa94d;--green:#51cf66;
  --promo:#ffd43b;--voice:#ff6b9d;--voice2:#ff9ec4;--vdim:rgba(255,107,157,.12);
  --notag:rgba(255,212,59,.06);--notag-b:rgba(255,212,59,.18);
  --r:10px;--nav:58px;--safe:env(safe-area-inset-bottom,0px);
  --font:'Courier New','Lucida Console',monospace
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font)}
#app{display:flex;flex-direction:column;height:100%}

/* HEADER */
#hdr{background:var(--s1);border-bottom:1px solid var(--border);height:50px;
  display:flex;align-items:center;padding:0 14px;justify-content:space-between;flex-shrink:0;z-index:10}
#logo{font-size:16px;letter-spacing:3px;color:var(--accent2);font-weight:normal}
#hacts{display:flex;gap:4px}
.ib{background:none;border:none;color:var(--text2);font-size:18px;cursor:pointer;
  padding:8px;border-radius:8px;transition:color .15s,background .15s;display:flex;align-items:center}
.ib:active,.ib.on{color:var(--accent2);background:var(--adim)}

/* FILTER BAR */
#fbar{background:var(--s1);border-bottom:1px solid var(--border);
  padding:7px 12px;display:flex;gap:6px;overflow-x:auto;flex-shrink:0;scrollbar-width:none}
#fbar::-webkit-scrollbar{display:none}
.chip{background:var(--s2);border:1px solid var(--border);color:var(--text2);border-radius:20px;
  padding:4px 12px;font-size:11px;white-space:nowrap;cursor:pointer;transition:all .15s;
  flex-shrink:0;font-family:var(--font)}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--adim);border-color:var(--accent);color:var(--accent2)}
.chip.promo-chip.on{background:rgba(255,212,59,.1);border-color:var(--promo);color:var(--promo)}

/* MAIN */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* TIMELINE */
#tl{flex:1;overflow-y:auto;padding:6px 0;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
#tl::-webkit-scrollbar{width:2px}
#tl::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.mhdr{display:flex;align-items:center;justify-content:space-between;
  padding:10px 16px 5px;cursor:pointer;user-select:none}
.mlabel{font-size:10px;color:var(--accent);letter-spacing:3px;text-transform:uppercase}
.mtoggle{font-size:11px;color:var(--text3);transition:transform .2s}
.mtoggle.c{transform:rotate(-90deg)}
.mcontent.h{display:none}
.dhdr{padding:5px 16px 3px;font-size:10px;color:var(--text3);
  letter-spacing:1px;border-top:1px solid rgba(255,255,255,.03)}
.dnotes{padding:0 10px 4px;display:flex;flex-direction:column;gap:4px}
.ni{background:var(--s2);border:1px solid var(--border);border-radius:var(--r);
  padding:10px 13px;cursor:pointer;transition:border-color .15s}
.ni:active{background:var(--s3)}
.ni.notag{background:var(--notag);border-color:var(--notag-b)}
.ni.arch{opacity:.42}
.ni.promo{border-left:3px solid var(--promo)}
.ni.vn{border-left:3px solid var(--voice)}
.nmeta{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.ntime{font-size:10px;color:var(--text3)}
.ntag{font-size:10px;padding:1px 8px;border-radius:10px;background:var(--adim);
  color:var(--accent2);border:1px solid rgba(108,99,255,.2);max-width:110px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ntag.pt{background:rgba(255,212,59,.1);color:var(--promo);border-color:rgba(255,212,59,.2)}
.ntag.vt{background:var(--vdim);color:var(--voice2);border-color:rgba(255,107,157,.2)}
.narch{font-size:9px;color:var(--text3);margin-left:auto}
.ncontent{font-size:13px;line-height:1.55;color:var(--text);white-space:pre-wrap;word-break:break-word}

/* Mini voice player */
.vplayer{display:flex;align-items:center;gap:10px;
  background:var(--vdim);border-radius:8px;padding:8px 12px;margin-top:6px}
.vplaybtn{background:var(--voice);border:none;border-radius:50%;width:32px;height:32px;
  color:#fff;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:transform .1s}
.vplaybtn:active{transform:scale(.9)}
.vwave{flex:1;height:22px;display:flex;align-items:center;gap:1.5px;overflow:hidden}
.vbar{background:var(--voice);border-radius:2px;width:2px;opacity:.35;transition:opacity .1s}
.vbar.lit{opacity:1}
.vdur{font-size:10px;color:var(--voice2);flex-shrink:0;min-width:32px;text-align:right}

/* INPUT */
#iarea{background:var(--s1);border-top:1px solid var(--border);
  padding:10px 12px calc(10px + var(--safe));flex-shrink:0}
#irow{display:flex;gap:8px;align-items:flex-end}
#ni{flex:1;background:var(--s2);border:1px solid var(--border);border-radius:var(--r);
  color:var(--text);font-size:14px;font-family:var(--font);padding:10px 12px;resize:none;
  min-height:44px;max-height:120px;outline:none;line-height:1.5;transition:border-color .15s}
#ni:focus{border-color:var(--accent)}
#ni::placeholder{color:var(--text3)}
#send{background:var(--accent);border:none;border-radius:var(--r);color:#fff;font-size:17px;
  width:44px;height:44px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .15s,transform .1s;flex-shrink:0}
#send:active{background:var(--accent2);transform:scale(.93)}
#micbtn{background:var(--s2);border:1px solid var(--border);border-radius:var(--r);
  width:44px;height:44px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:20px;transition:all .2s;flex-shrink:0;color:var(--text2)}
#micbtn.rec{background:var(--vdim);border-color:var(--voice);color:var(--voice);
  animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,107,157,.35)}
  50%{box-shadow:0 0 0 7px rgba(255,107,157,0)}}
#itag{display:flex;align-items:center;gap:6px;margin-top:7px;flex-wrap:wrap}
#itag-l{font-size:10px;color:var(--text3)}
.isel{background:var(--s3);border:1px solid var(--border);color:var(--text2);
  border-radius:6px;font-size:11px;padding:3px 7px;font-family:var(--font);max-width:110px}
#rectimer{font-size:11px;color:var(--voice);display:none;align-items:center;gap:5px}
#rectimer.on{display:flex}
#rectimer::before{content:'●';animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

/* NAV */
#nav{background:var(--s1);border-top:1px solid var(--border);
  display:flex;height:var(--nav);padding-bottom:var(--safe);flex-shrink:0}
.nbtn{flex:1;background:none;border:none;color:var(--text3);font-size:10px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  transition:color .15s;font-family:var(--font)}
.nicon{font-size:19px}
.nbtn.on{color:var(--accent2)}

/* TAGS VIEW */
#tags-v{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
#tags-v::-webkit-scrollbar{width:2px}
#tags-v::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.vhdr{display:flex;justify-content:space-between;align-items:center;padding:2px 0 6px}
.vtitle{font-size:11px;color:var(--accent);letter-spacing:2px}
.abtn{background:var(--adim);border:1px solid rgba(108,99,255,.25);color:var(--accent2);
  border-radius:8px;padding:6px 14px;font-size:11px;cursor:pointer;font-family:var(--font)}
.abtn:active{background:rgba(108,99,255,.22)}
.tcard{background:var(--s2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.tchdr{display:flex;align-items:center;padding:12px 14px;cursor:pointer;gap:10px}
.tcname{font-size:13px;color:var(--text);flex:1}
.tcname.pn{color:var(--promo)}
.tcnt{font-size:10px;color:var(--text3);background:var(--s3);padding:2px 8px;border-radius:10px}
.tdel{background:none;border:none;color:var(--text3);font-size:13px;cursor:pointer;padding:4px 6px;border-radius:6px}
.tdel:active{color:var(--danger)}
.tsubs{padding:0 14px 12px;flex-direction:column;gap:5px;display:none}
.tsubs.open{display:flex}
.srow{display:flex;align-items:center;gap:8px;background:var(--s3);border-radius:7px;padding:7px 10px}
.sdot{width:4px;height:4px;border-radius:50%;background:var(--accent);flex-shrink:0}
.sname{font-size:12px;color:var(--text2);flex:1}
.sdel{background:none;border:none;color:var(--text3);font-size:12px;cursor:pointer;padding:2px 6px}
.sdel:active{color:var(--danger)}
.asub{background:none;border:1px dashed var(--border);color:var(--text3);border-radius:7px;
  padding:6px 10px;font-size:11px;cursor:pointer;font-family:var(--font);text-align:left;width:100%;
  transition:border-color .15s,color .15s}
.asub:active{border-color:var(--accent);color:var(--accent2)}

/* DATA VIEW */
#data-v{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.dsec{background:var(--s2);border:1px solid var(--border);border-radius:var(--r);padding:14px}
.dstitle{font-size:10px;color:var(--accent);letter-spacing:2px;margin-bottom:10px}
.drow{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.drow:last-child{border-bottom:none}
.dlabel{font-size:12px;color:var(--text2)}
.dval{font-size:12px;color:var(--text)}
.dbtn{width:100%;padding:12px;background:var(--s2);border:1px solid var(--border);border-radius:var(--r);
  color:var(--text);font-size:13px;cursor:pointer;font-family:var(--font);text-align:left;margin-top:8px}
.dbtn:first-of-type{margin-top:0}
.dbtn:active{background:var(--s3)}
.dbtn.dd{border-color:rgba(255,107,107,.2);color:var(--danger)}

/* MODAL */
.moverlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.8);
  display:flex;align-items:flex-end;animation:fi .15s ease}
.moverlay.h{display:none}
@keyframes fi{from{opacity:0}to{opacity:1}}
.modal{background:var(--s1);border:1px solid var(--border);border-radius:18px 18px 0 0;
  width:100%;padding:20px 20px calc(20px + var(--safe));animation:su .2s ease;max-height:88vh;overflow-y:auto}
@keyframes su{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.mtitle{font-size:13px;color:var(--accent2);letter-spacing:1px;margin-bottom:15px}
.minput{width:100%;background:var(--s2);border:1px solid var(--border);border-radius:var(--r);
  color:var(--text);font-size:14px;font-family:var(--font);padding:10px 12px;outline:none;
  margin-bottom:12px;transition:border-color .15s}
.minput:focus{border-color:var(--accent)}
.msel{width:100%;background:var(--s2);border:1px solid var(--border);border-radius:var(--r);
  color:var(--text);font-size:13px;font-family:var(--font);padding:10px 12px;outline:none;margin-bottom:12px}
.macts{display:flex;gap:10px;margin-top:4px}
.mbtn{flex:1;padding:12px;border-radius:var(--r);font-size:13px;cursor:pointer;
  font-family:var(--font);transition:all .15s;border:none}
.mbtn.p{background:var(--accent);color:#fff}
.mbtn.p:active{background:var(--accent2);transform:scale(.98)}
.mbtn.s{background:var(--s2);color:var(--text2);border:1px solid var(--border)}
.mbtn.d{background:rgba(255,107,107,.12);color:var(--danger);border:1px solid rgba(255,107,107,.22)}
.mbtn.d:active{background:rgba(255,107,107,.22)}
.msec{margin-bottom:13px}
.mlbl{font-size:10px;color:var(--text3);margin-bottom:5px;letter-spacing:1px}
.ndc{font-family:var(--font);font-size:13px;line-height:1.65;color:var(--text);
  background:var(--s2);border-radius:var(--r);padding:12px;margin-bottom:13px;
  white-space:pre-wrap;word-break:break-word;min-height:60px;
  border:1px solid var(--border);outline:none}
.ndc:focus{border-color:var(--accent)}

/* Audio player (modal) */
.aplay{background:var(--vdim);border:1px solid rgba(255,107,157,.2);border-radius:var(--r);
  padding:12px;margin-bottom:13px;display:flex;align-items:center;gap:12px}
.aplaybtn{background:var(--voice);border:none;border-radius:50%;width:36px;height:36px;
  color:#fff;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.aprog{flex:1;height:4px;background:rgba(255,107,157,.2);border-radius:2px;cursor:pointer;position:relative}
.aprogbar{height:100%;background:var(--voice);border-radius:2px;width:0%;transition:width .1s}
.adurtxt{font-size:11px;color:var(--voice2);min-width:36px;text-align:right}

/* Voice rec overlay */
#vrec{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.92);
  flex-direction:column;align-items:center;justify-content:center;gap:22px;display:none}
#vrec.on{display:flex}
#vreclbl{font-size:11px;color:var(--voice2);letter-spacing:3px}
#vwaves{display:flex;align-items:center;gap:3px;height:64px}
.vw{background:var(--voice);border-radius:2px;width:4px;
  animation:wv .8s ease-in-out infinite alternate}
@keyframes wv{from{height:6px;opacity:.3}to{height:52px;opacity:1}}
#vtimer{font-size:32px;color:var(--text);letter-spacing:4px}
#vstop{background:var(--voice);border:none;border-radius:50%;
  width:68px;height:68px;color:#fff;font-size:26px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  animation:rp 1.5s infinite}
@keyframes rp{0%{box-shadow:0 0 0 0 rgba(255,107,157,.4)}
  70%{box-shadow:0 0 0 18px rgba(255,107,157,0)}
  100%{box-shadow:0 0 0 0 rgba(255,107,157,0)}}
#vcancel{background:none;border:1px solid var(--border);border-radius:var(--r);
  color:var(--text2);padding:10px 24px;cursor:pointer;font-family:var(--font);font-size:12px}

/* TOAST */
#toast{position:fixed;bottom:calc(var(--nav) + 80px + var(--safe));left:50%;
  transform:translateX(-50%) translateY(20px);background:var(--s3);color:var(--text);
  padding:10px 20px;border-radius:20px;font-size:12px;border:1px solid var(--border);
  opacity:0;transition:opacity .2s,transform .2s;z-index:200;white-space:nowrap;
  pointer-events:none;font-family:var(--font)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* EMPTY */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:60px 20px;color:var(--text3);gap:12px;text-align:center}
.eico{font-size:36px;opacity:.35}
.etxt{font-size:11px;letter-spacing:1px;line-height:1.7}
</style>
</head>
<body>
<div id="app">
  <div id="hdr">
    <h1 id="logo">MINDFLOW</h1>
    <div id="hacts">
      <button class="ib" id="arch-btn" title="Archiviati" onclick="toggleArch()">📁</button>
      <button class="ib" title="Dati" onclick="showView('data')">⚙️</button>
    </div>
  </div>

  <!-- TIMELINE -->
  <div id="main">
    <div id="fbar"></div>
    <div id="tl"></div>
    <div id="iarea">
      <div id="irow">
        <button id="micbtn" onclick="toggleRec()" title="Nota vocale">🎙️</button>
        <textarea id="ni" placeholder="Scrivi una nota…" rows="1"></textarea>
        <button id="send" onclick="saveTextNote()">↑</button>
      </div>
      <div id="itag">
        <span id="itag-l">tag:</span>
        <select class="isel" id="itagsel" onchange="updSubSel()">
          <option value="">—</option>
        </select>
        <select class="isel" id="isubsel"><option value="">—</option></select>
        <span id="rectimer">REC 00:00</span>
      </div>
    </div>
  </div>

  <!-- TAGS -->
  <div id="tags-v" style="display:none"></div>
  <!-- DATA -->
  <div id="data-v" style="display:none"></div>

  <div id="nav">
    <button class="nbtn on" id="n-tl" onclick="showView('timeline')">
      <span class="nicon">📋</span>Timeline
    </button>
    <button class="nbtn" id="n-tags" onclick="showView('tags')">
      <span class="nicon">🏷️</span>Tags
    </button>
  </div>
</div>

<!-- VOICE REC OVERLAY -->
<div id="vrec">
  <div id="vreclbl">● REC IN CORSO</div>
  <div id="vwaves"></div>
  <div id="vtimer">00:00</div>
  <button id="vstop" onclick="stopRec()">■</button>
  <button id="vcancel" onclick="cancelRec()">annulla</button>
</div>

<!-- MODAL -->
<div class="moverlay h" id="mov" onclick="closeMO(event)">
  <div class="modal" id="mc"></div>
</div>

<div id="toast"></div>

<script>
// ═══ STATE ═══
let notes=[], tags={}, viewMode='timeline', filterTag='', showArchived=false, toastTimer=null;
let mediaRec=null, audioChunks=[], recInterval=null, recSecs=0;

const SK='mindflow_notes', TK='mindflow_tags';
const MONTHS=['GENNAIO','FEBBRAIO','MARZO','APRILE','MAGGIO','GIUGNO','LUGLIO','AGOSTO','SETTEMBRE','OTTOBRE','NOVEMBRE','DICEMBRE'];
const WDAYS=['DOM','LUN','MAR','MER','GIO','VEN','SAB'];

// ═══ INIT ═══
function init() {
  loadData(); ensurePromo(); setupSW(); setupInput(); injectManifest(); buildWaveAnim();
  renderAll(); showView('timeline');
}

function loadData() {
  try { notes=JSON.parse(localStorage.getItem(SK)||'[]'); if(!Array.isArray(notes))notes=[]; } catch{notes=[];}
  try { tags=JSON.parse(localStorage.getItem(TK)||'{}'); if(typeof tags!=='object'||Array.isArray(tags))tags={}; } catch{tags={};}
}
function save() { localStorage.setItem(SK,JSON.stringify(notes)); }
function saveTags() { localStorage.setItem(TK,JSON.stringify(tags)); }
function ensurePromo() { if(!tags['PROMEMORIA']){tags['PROMEMORIA']=[];saveTags();} }

function setupSW() { if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{}); }
function setupInput() {
  const inp=document.getElementById('ni');
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();saveTextNote();} });
  inp.addEventListener('input',()=>{ inp.style.height='auto'; inp.style.height=Math.min(inp.scrollHeight,120)+'px'; });
}

function injectManifest() {
  const m={name:'MindFlow Local',short_name:'MindFlow',start_url:'/',display:'standalone',
    background_color:'#0d0d14',theme_color:'#0d0d14',orientation:'portrait',
    icons:[{src:svgIco(192),sizes:'192x192',type:'image/svg+xml'},{src:svgIco(512),sizes:'512x512',type:'image/svg+xml'}]};
  const link=document.createElement('link'); link.rel='manifest';
  link.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/json'}));
  document.head.appendChild(link);
}
function svgIco(s) {
  return 'data:image/svg+xml,'+encodeURIComponent(
    `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 ${s} ${s}'><rect width='${s}' height='${s}' fill='%230d0d14'/><text x='${s/2}' y='${s*.62}' font-size='${s*.38}' text-anchor='middle' fill='%239d97ff'>✦</text></svg>`);
}

function buildWaveAnim() {
  const wc=document.getElementById('vwaves'); wc.innerHTML='';
  for(let i=0;i<18;i++){
    const b=document.createElement('div'); b.className='vw';
    b.style.animationDelay=(i*0.07)+'s';
    b.style.animationDuration=(0.55+Math.random()*0.65)+'s';
    wc.appendChild(b);
  }
}

// ═══ UUID / DATE ═══
function uid() { return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function tsDate(ts) { return new Date(ts).toISOString().slice(0,10); }
function tsMonth(ts) { return tsDate(ts).slice(0,7); }
function fmtMonth(m) { const[y,mo]=m.split('-'); return MONTHS[parseInt(mo)-1]+' '+y; }
function fmtDay(d) { const dt=new Date(d+'T00:00:00'); return WDAYS[dt.getDay()]+' '+dt.getDate().toString().padStart(2,'0')+'.'+String(dt.getMonth()+1).padStart(2,'0'); }
function fmtTime(ts) { const d=new Date(ts); return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0'); }
function fmtSecs(s) { return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }

// ═══ SAVE NOTE ═══
function saveTextNote() {
  const inp=document.getElementById('ni');
  const content=inp.value.trim(); if(!content) return;
  const tag=document.getElementById('itagsel').value;
  const subtag=document.getElementById('isubsel').value;

// ═══ INDEXEDDB AUDIO ═══
function openDB() {
  return new Promise((res,rej)=>{
    const r=indexedDB.open('mindflow_audio',1);
    r.onupgradeneeded=e=>e.target.result.createObjectStore('audio');
    r.onsuccess=e=>res(e.target.result);
    r.onerror=()=>rej();
  });
}
async function saveAudio(id,blob) {
  try { const db=await openDB(); const tx=db.transaction('audio','readwrite'); tx.objectStore('audio').put(blob,id); } catch{}
}
async function loadAudio(id) {
  try {
    const db=await openDB();
    return new Promise((res,rej)=>{ const tx=db.transaction('audio','readonly'); const r=tx.objectStore('audio').get(id); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(); });
  } catch { return null; }
}
async function delAudio(id) { try { const db=await openDB(); const tx=db.transaction('audio','readwrite'); tx.objectStore('audio').delete(id); }catch{} }

// ═══ VOICE RECORDING ═══
async function toggleRec() {
  if(mediaRec&&mediaRec.state==='recording'){stopRec();return;}
  if(!navigator.mediaDevices?.getUserMedia){toast('Microfono non supportato');return;}
  try {
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    audioChunks=[];
    const mime=['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/mp4'].find(t=>MediaRecorder.isTypeSupported(t))||'';
    mediaRec=new MediaRecorder(stream,mime?{mimeType:mime}:{});
    mediaRec.ondataavailable=e=>{ if(e.data.size>0) audioChunks.push(e.data); };
    mediaRec.onstop=()=>{
      stream.getTracks().forEach(t=>t.stop());
      saveVoiceNote(new Blob(audioChunks,{type:mediaRec.mimeType||'audio/webm'}),recSecs);
      hideRecUI();
    };
    mediaRec.start(100); recSecs=0; showRecUI();
    recInterval=setInterval(()=>{
      recSecs++;
      document.getElementById('vtimer').textContent=fmtSecs(recSecs);
      document.getElementById('rectimer').textContent='REC '+fmtSecs(recSecs);
    },1000);
  } catch { toast('Microfono non accessibile'); }
}

function stopRec() {
  if(mediaRec&&mediaRec.state!=='inactive') mediaRec.stop();
  clearInterval(recInterval);
}
function cancelRec() {
  if(mediaRec&&mediaRec.state!=='inactive'){
    mediaRec.ondataavailable=null; mediaRec.onstop=()=>{};
    mediaRec.stop();
  }
  clearInterval(recInterval); hideRecUI(); toast('Registrazione annullata');
}
function showRecUI() {
  document.getElementById('vrec').classList.add('on');
  document.getElementById('micbtn').classList.add('rec');
  document.getElementById('rectimer').classList.add('on');
}
function hideRecUI() {
  document.getElementById('vrec').classList.remove('on');
  document.getElementById('micbtn').classList.remove('rec');
  document.getElementById('rectimer').classList.remove('on');
  document.getElementById('vtimer').textContent='00:00';
}

function renderTimeline() {

function mkNoteEl(note) {
  const isV=note.type==='voice';

  const tm=document.createElement('div'); tm.className='ntime'; tm.textContent=fmtTime(note.timestamp);
  meta.appendChild(tm);
  if(note.tag){

    b.textContent=note.subtag?note.tag+' › '+note.subtag:note.tag;
    meta.appendChild(b);
  }
  if(note.status==='archived'){ const a=document.createElement('div'); a.className='narch'; a.textContent='[arch]'; meta.appendChild(a); }

function mkMiniPlayer(note) {
  const wrap=document.createElement('div'); wrap.className='vplayer';
  const btn=document.createElement('button'); btn.className='vplaybtn'; btn.textContent='▶';
  const wv=document.createElement('div'); wv.className='vwave';
  const bars=22; const bEls=[];
  for(let i=0;i<bars;i++){
    const b=document.createElement('div'); b.className='vbar';
    b.style.height=(5+Math.random()*18)+'px';
    wv.appendChild(b); bEls.push(b);
  }
  const dur=document.createElement('div'); dur.className='vdur'; dur.textContent=fmtSecs(note.duration||0);
  let playing=false, aud=null, prog=null;
  btn.onclick=async e=>{
    e.stopPropagation();
    if(playing&&aud){ aud.pause(); aud.currentTime=0; playing=false; btn.textContent='▶'; clearInterval(prog); bEls.forEach(b=>b.classList.remove('lit')); return; }
    const blob=await loadAudio(note.id);
    if(!blob){ toast('Audio non trovato'); return; }
    const url=URL.createObjectURL(blob);
    aud=new Audio(url);
    aud.onended=()=>{ playing=false; btn.textContent='▶'; clearInterval(prog); bEls.forEach(b=>b.classList.remove('lit')); URL.revokeObjectURL(url); dur.textContent=fmtSecs(note.duration||0); };
    aud.ontimeupdate=()=>{ dur.textContent=fmtSecs(Math.floor(aud.currentTime)); };
    aud.play(); playing=true; btn.textContent='■';
    let i=0; prog=setInterval(()=>{ bEls.forEach((b,idx)=>b.classList.toggle('lit',idx<=i%bars)); i++; },(note.duration*1000/bars)||200);
  };
  wrap.appendChild(btn); wrap.appendChild(wv); wrap.appendChild(dur);
  return wrap;
}

async function openDetail(id) {

  const tagOpts=Object.keys(tags).map(t=>`<option value="${t}" ${note.tag===t?'selected':''}>${t}</option>`).join('');

      <button class="mbtn s" onclick="archNote('${id}')">${isA?'↩ Ripristina':'📁 Archivia'}</button>
      ${!isV?`<button class="mbtn p" onclick="updNote('${id}')">Salva</button>`:''}
    </div>
    <div style="margin-top:10px">
      <button class="mbtn d" onclick="delNote('${id}')">🗑️  Elimina</button>
    </div>`);

  if(isV) {
    const blob=await loadAudio(note.id);
    const playBtn=document.getElementById('aplaybtn');

    const durTxt=document.getElementById('adurtxt');
    const progEl=document.getElementById('aprog');
    if(!blob){ playBtn.textContent='?'; return; }
    const url=URL.createObjectURL(blob);
    const aud=new Audio(url);
    let playing=false;

      progBar.style.width=(aud.duration?(aud.currentTime/aud.duration*100):0)+'%';
      durTxt.textContent=fmtSecs(Math.floor(aud.currentTime));

    playBtn.onclick=()=>{ if(playing){aud.pause();playing=false;playBtn.textContent='▶';}else{aud.play();playing=true;playBtn.textContent='■';} };
    progEl.onclick=e=>{ const r=progEl.getBoundingClientRect(); aud.currentTime=(e.clientX-r.left)/r.width*aud.duration; };
  }

// ═══ CSV ═══
function exportCSV() {
  const hdr='timestamp,date,month,content,tag,subtag,status,origin';
  const rows=notes.map(n=>{
    const f=[n.timestamp,n.date,n.month,n.content,n.tag||'',n.subtag||'',n.status,n.origin||'generic'];
    return f.map(v=>{ const s=String(v); return(s.includes(',')||s.includes('"')||s.includes('\n'))?'"'+s.replace(/"/g,'""')+'"':s; }).join(',');
  });
  const b=new Blob([[hdr,...rows].join('\n')],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b);
  a.download='mindflow_'+new Date().toISOString().slice(0,10)+'.csv'; a.click(); URL.revokeObjectURL(a.href);
  toast('CSV esportato (audio escluso)');
}
function importCSV() {
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.csv,text/csv';
  inp.onchange=e=>{ const f=e.target.files[0]; if(!f)return;
    const r=new FileReader(); r.onload=ev=>{ const imp=parseCSV(ev.target.result); let added=0;
      imp.forEach(n=>{ if(!notes.find(x=>x.timestamp===n.timestamp&&x.content===n.content)){notes.push(n);added++;} });
      save(); renderAll(); toast('Importate '+added+' note'); }; r.readAsText(f); };
  inp.click();
}
function parseCSV(text) {
  const lines=text.split('\n').map(l=>l.trim()).filter(l=>l);
  if(lines.length<2)return[];
  const hdrs=parseRow(lines[0]);
  const isOld=hdrs.length===2&&hdrs[0]==='timestamp'&&hdrs[1]==='content';
  return lines.slice(1).map(line=>{
    const cols=parseRow(line); if(!cols.length)return null;
    let n={};
    if(isOld){n.timestamp=cols[0]||'';n.content=cols[1]||'';n.tag='';n.subtag='';n.status='active';n.origin='imported';}
    else{hdrs.forEach((h,i)=>n[h]=cols[i]||'');n.origin=n.origin||'imported';n.status=n.status||'active';}
    if(!n.timestamp||!n.content)return null;
    n.id=n.id||uid(); n.date=n.date||tsDate(n.timestamp); n.month=n.month||tsMonth(n.timestamp); n.type=n.type||'text';
    return n;
  }).filter(Boolean);
}
function parseRow(line) {
  const res=[]; let cur='',inQ=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++;}else{inQ=!inQ;}}
    else if(c===','&&!inQ){res.push(cur);cur='';}else cur+=c;
  } res.push(cur); return res;
}

// ═══ VIEW SWITCH ═══
function showView(v) {
  viewMode=v;
  ['main','tags-v','data-v'].forEach(id=>{ const el=document.getElementById(id); el.style.display='none'; });
  document.querySelectorAll('.nbtn').forEach(b=>b.classList.remove('on'));
  if(v==='timeline'){
    const m=document.getElementById('main'); m.style.display='flex'; m.style.flexDirection='column';
    document.getElementById('n-tl').classList.add('on'); renderTimeline(); setTimeout(scrollBot,80);
  } else if(v==='tags'){
    const tv=document.getElementById('tags-v'); tv.style.display='flex'; tv.style.flexDirection='column';
    document.getElementById('n-tags').classList.add('on'); renderTagsView();
  } else if(v==='data'){
    const dv=document.getElementById('data-v'); dv.style.display='flex'; dv.style.flexDirection='column';
    renderDataView();
  }
}

// ═══ TOAST ═══
function toast(msg) {
  const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('on');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('on'),2300);
}

// ═══ START ═══
init();
