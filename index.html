<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MindFlow">
<title>MindFlow Local</title>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface2: #1a1a26;
    --surface3: #222232;
    --border: #2a2a3e;
    --accent: #7c6af7;
    --accent2: #a78bfa;
    --accent-dim: rgba(124,106,247,0.15);
    --text: #e8e8f0;
    --text2: #9090b0;
    --text3: #5a5a7a;
    --danger: #f87171;
    --warn: #fb923c;
    --green: #4ade80;
    --promemoria: #fbbf24;
    --notag: rgba(251,191,36,0.08);
    --notag-border: rgba(251,191,36,0.25);
    --font-main: 'Courier New', 'Lucida Console', monospace;
    --font-ui: system-ui, -apple-system, sans-serif;
    --radius: 10px;
    --nav-h: 56px;
    --input-h: 64px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font-ui); }

  /* LAYOUT */
  #app { display: flex; flex-direction: column; height: 100%; }
  #header { 
    background: var(--surface); 
    border-bottom: 1px solid var(--border);
    padding: 0 16px;
    display: flex; align-items: center; justify-content: space-between;
    height: 52px; flex-shrink: 0; z-index: 10;
  }
  #header h1 { 
    font-family: var(--font-main); 
    font-size: 18px; 
    color: var(--accent2);
    letter-spacing: 2px;
    font-weight: normal;
  }
  #header-actions { display: flex; gap: 8px; }
  .icon-btn {
    background: none; border: none; color: var(--text2); 
    font-size: 20px; cursor: pointer; padding: 8px;
    border-radius: 8px; display: flex; align-items: center; justify-content: center;
    transition: color 0.15s, background 0.15s;
  }
  .icon-btn:active, .icon-btn:hover { color: var(--accent2); background: var(--accent-dim); }

  #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }

  /* FILTER BAR */
  #filter-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 8px 12px;
    display: flex; gap: 6px; overflow-x: auto; flex-shrink: 0;
    scrollbar-width: none;
  }
  #filter-bar::-webkit-scrollbar { display: none; }
  .filter-chip {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text2); border-radius: 20px;
    padding: 4px 12px; font-size: 12px; white-space: nowrap;
    cursor: pointer; transition: all 0.15s; flex-shrink: 0;
    font-family: var(--font-main);
  }
  .filter-chip:active { transform: scale(0.96); }
  .filter-chip.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent2); }
  .filter-chip.promemoria-chip.active { 
    background: rgba(251,191,36,0.12); 
    border-color: var(--promemoria); 
    color: var(--promemoria); 
  }

  /* TIMELINE */
  #timeline { 
    flex: 1; overflow-y: auto; padding: 8px 0;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }
  #timeline::-webkit-scrollbar { width: 3px; }
  #timeline::-webkit-scrollbar-track { background: transparent; }
  #timeline::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .month-group { margin-bottom: 4px; }
  .month-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px 6px;
    cursor: pointer; user-select: none;
  }
  .month-label {
    font-family: var(--font-main); font-size: 11px;
    color: var(--accent); letter-spacing: 3px;
    text-transform: uppercase;
  }
  .month-toggle { font-size: 12px; color: var(--text3); transition: transform 0.2s; }
  .month-toggle.collapsed { transform: rotate(-90deg); }
  .month-content { }
  .month-content.hidden { display: none; }

  .day-group { margin-bottom: 2px; }
  .day-header {
    padding: 6px 16px 4px;
    font-size: 11px; color: var(--text3);
    font-family: var(--font-main); letter-spacing: 1px;
    border-top: 1px solid rgba(255,255,255,0.03);
  }
  .day-notes { padding: 0 10px; display: flex; flex-direction: column; gap: 4px; }

  .note-item {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 14px;
    position: relative;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .note-item:active { background: var(--surface3); }
  .note-item.no-tag {
    background: var(--notag);
    border-color: var(--notag-border);
  }
  .note-item.archived { opacity: 0.45; }
  .note-item.promemoria-note { border-left: 3px solid var(--promemoria); }

  .note-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
  .note-time { font-size: 10px; color: var(--text3); font-family: var(--font-main); }
  .note-tag-badge {
    font-size: 10px; padding: 1px 7px;
    border-radius: 10px; 
    background: var(--accent-dim); color: var(--accent2);
    border: 1px solid rgba(124,106,247,0.25);
    font-family: var(--font-main); letter-spacing: 0.5px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px;
  }
  .note-tag-badge.promemoria-badge {
    background: rgba(251,191,36,0.1); color: var(--promemoria);
    border-color: rgba(251,191,36,0.2);
  }
  .note-status-badge {
    font-size: 9px; color: var(--text3); margin-left: auto;
    font-family: var(--font-main);
  }
  .note-content {
    font-size: 14px; line-height: 1.55; color: var(--text);
    white-space: pre-wrap; word-break: break-word;
    font-family: var(--font-main);
  }

  /* INPUT AREA */
  #input-area {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 10px 12px;
    padding-bottom: calc(10px + var(--safe-bottom));
    flex-shrink: 0;
  }
  #input-row { display: flex; gap: 8px; align-items: flex-end; }
  #note-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-size: 14px;
    font-family: var(--font-main);
    padding: 10px 12px;
    resize: none;
    min-height: 44px; max-height: 100px;
    outline: none;
    transition: border-color 0.15s;
    line-height: 1.5;
  }
  #note-input:focus { border-color: var(--accent); }
  #note-input::placeholder { color: var(--text3); }
  #send-btn {
    background: var(--accent);
    border: none; border-radius: var(--radius);
    color: #fff; font-size: 18px;
    width: 44px; height: 44px;
    cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, transform 0.1s;
  }
  #send-btn:active { background: var(--accent2); transform: scale(0.95); }
  #input-tag-row {
    display: flex; align-items: center; gap: 6px;
    margin-top: 6px;
  }
  #input-tag-label { font-size: 11px; color: var(--text3); font-family: var(--font-main); }
  #input-tag-select, #input-subtag-select {
    background: var(--surface3); border: 1px solid var(--border);
    color: var(--text2); border-radius: 6px;
    font-size: 11px; padding: 3px 6px;
    font-family: var(--font-main);
    max-width: 100px;
  }

  /* NAV */
  #nav {
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    height: var(--nav-h);
    padding-bottom: var(--safe-bottom);
    flex-shrink: 0;
  }
  .nav-btn {
    flex: 1; background: none; border: none;
    color: var(--text3); font-size: 10px;
    cursor: pointer; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 4px;
    transition: color 0.15s;
    font-family: var(--font-ui);
  }
  .nav-btn .nav-icon { font-size: 20px; }
  .nav-btn.active { color: var(--accent2); }
  .nav-btn:active { color: var(--accent); }

  /* TAGS VIEW */
  #tags-view {
    flex: 1; overflow-y: auto; padding: 12px;
    display: flex; flex-direction: column; gap: 8px;
  }
  #tags-view::-webkit-scrollbar { width: 3px; }
  #tags-view::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .tags-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 4px 0;
  }
  .tags-title { font-family: var(--font-main); color: var(--accent); font-size: 12px; letter-spacing: 2px; }
  .add-btn {
    background: var(--accent-dim); border: 1px solid rgba(124,106,247,0.3);
    color: var(--accent2); border-radius: 8px;
    padding: 6px 14px; font-size: 12px; cursor: pointer;
    font-family: var(--font-main);
    transition: background 0.15s;
  }
  .add-btn:active { background: rgba(124,106,247,0.25); }

  .tag-card {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
  }
  .tag-card-header {
    display: flex; align-items: center; padding: 12px 14px;
    cursor: pointer; gap: 10px;
  }
  .tag-card-name { 
    font-family: var(--font-main); font-size: 13px;
    color: var(--text); flex: 1;
  }
  .tag-card-name.promemoria-name { color: var(--promemoria); }
  .tag-count {
    font-size: 11px; color: var(--text3);
    font-family: var(--font-main);
    background: var(--surface3); 
    padding: 2px 8px; border-radius: 10px;
  }
  .tag-del-btn {
    background: none; border: none; color: var(--text3);
    font-size: 14px; cursor: pointer; padding: 4px;
    border-radius: 6px; transition: color 0.15s;
  }
  .tag-del-btn:active { color: var(--danger); }
  .subtags-area { padding: 0 14px 12px; display: flex; flex-direction: column; gap: 6px; }
  .subtag-row {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface3); border-radius: 7px;
    padding: 7px 10px;
  }
  .subtag-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
  .subtag-name { font-family: var(--font-main); font-size: 12px; color: var(--text2); flex: 1; }
  .subtag-del { background: none; border: none; color: var(--text3); font-size: 12px; cursor: pointer; padding: 2px 6px; }
  .subtag-del:active { color: var(--danger); }
  .add-subtag-btn {
    background: none; border: 1px dashed var(--border);
    color: var(--text3); border-radius: 7px;
    padding: 6px 10px; font-size: 11px; cursor: pointer;
    font-family: var(--font-main); text-align: left;
    transition: border-color 0.15s, color 0.15s;
  }
  .add-subtag-btn:active { border-color: var(--accent); color: var(--accent2); }

  /* MODAL */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.75);
    display: flex; align-items: flex-end;
    animation: fadeIn 0.15s ease;
  }
  .modal-overlay.hidden { display: none; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px 18px 0 0;
    width: 100%; padding: 20px;
    padding-bottom: calc(20px + var(--safe-bottom));
    animation: slideUp 0.2s ease;
    max-height: 85vh; overflow-y: auto;
  }
  @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal-title {
    font-family: var(--font-main); font-size: 14px;
    color: var(--accent2); letter-spacing: 1px;
    margin-bottom: 16px;
  }
  .modal-input {
    width: 100%; background: var(--surface2);
    border: 1px solid var(--border); border-radius: var(--radius);
    color: var(--text); font-size: 14px;
    font-family: var(--font-main);
    padding: 10px 12px; outline: none;
    margin-bottom: 12px;
    transition: border-color 0.15s;
  }
  .modal-input:focus { border-color: var(--accent); }
  .modal-select {
    width: 100%; background: var(--surface2);
    border: 1px solid var(--border); border-radius: var(--radius);
    color: var(--text); font-size: 13px;
    font-family: var(--font-main);
    padding: 10px 12px; outline: none;
    margin-bottom: 12px;
  }
  .modal-actions { display: flex; gap: 10px; margin-top: 4px; }
  .modal-btn {
    flex: 1; padding: 12px; border-radius: var(--radius);
    font-size: 13px; cursor: pointer; font-family: var(--font-main);
    transition: all 0.15s; border: none;
  }
  .modal-btn.primary { background: var(--accent); color: #fff; }
  .modal-btn.primary:active { background: var(--accent2); transform: scale(0.98); }
  .modal-btn.secondary { background: var(--surface2); color: var(--text2); border: 1px solid var(--border); }
  .modal-btn.secondary:active { background: var(--surface3); }
  .modal-btn.danger { background: rgba(248,113,113,0.15); color: var(--danger); border: 1px solid rgba(248,113,113,0.25); }
  .modal-btn.danger:active { background: rgba(248,113,113,0.25); }
  .modal-section { margin-bottom: 14px; }
  .modal-label { font-size: 11px; color: var(--text3); margin-bottom: 6px; font-family: var(--font-main); letter-spacing: 1px; }

  /* NOTE DETAIL */
  .note-detail-content {
    font-family: var(--font-main); font-size: 14px;
    line-height: 1.65; color: var(--text);
    background: var(--surface2); border-radius: var(--radius);
    padding: 12px; margin-bottom: 14px;
    white-space: pre-wrap; word-break: break-word;
    min-height: 60px;
    border: 1px solid var(--border);
  }

  /* TOAST */
  #toast {
    position: fixed; bottom: calc(var(--nav-h) + 80px + var(--safe-bottom));
    left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--surface3); color: var(--text);
    padding: 10px 20px; border-radius: 20px;
    font-size: 13px; font-family: var(--font-main);
    border: 1px solid var(--border);
    opacity: 0; transition: opacity 0.2s, transform 0.2s;
    z-index: 200; white-space: nowrap; pointer-events: none;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* DATA VIEW */
  #data-view { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .data-section {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px;
  }
  .data-section-title { font-family: var(--font-main); font-size: 11px; color: var(--accent); letter-spacing: 2px; margin-bottom: 10px; }
  .data-stat { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
  .data-stat:last-child { border-bottom: none; }
  .data-stat-label { font-size: 12px; color: var(--text2); font-family: var(--font-main); }
  .data-stat-value { font-size: 12px; color: var(--text); font-family: var(--font-main); }
  .data-btn {
    width: 100%; padding: 12px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--text);
    font-size: 13px; cursor: pointer;
    font-family: var(--font-main);
    transition: background 0.15s;
    text-align: left;
  }
  .data-btn:active { background: var(--surface3); }
  .data-btn.danger-btn { border-color: rgba(248,113,113,0.25); color: var(--danger); }

  /* EMPTY STATE */
  .empty-state {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 60px 20px; color: var(--text3);
    gap: 12px; text-align: center;
  }
  .empty-icon { font-size: 40px; opacity: 0.4; }
  .empty-text { font-family: var(--font-main); font-size: 12px; letter-spacing: 1px; line-height: 1.6; }

  /* PROMEMORIA INDICATOR */
  .promo-section {
    background: rgba(251,191,36,0.06);
    border: 1px solid rgba(251,191,36,0.15);
    border-radius: var(--radius); padding: 10px 14px;
    margin: 8px 10px; display: flex; align-items: center; gap: 10px;
    cursor: pointer;
  }
  .promo-icon { font-size: 16px; }
  .promo-count { font-family: var(--font-main); font-size: 12px; color: var(--promemoria); }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <h1>MINDFLOW</h1>
    <div id="header-actions">
      <button class="icon-btn" id="search-archive-btn" title="Mostra archiviati" onclick="toggleArchived()">📁</button>
      <button class="icon-btn" id="data-btn" title="Dati" onclick="showView('data')">⚙️</button>
    </div>
  </div>

  <!-- TIMELINE VIEW -->
  <div id="timeline-view" style="flex:1;display:flex;flex-direction:column;overflow:hidden;">
    <div id="filter-bar">
      <div class="filter-chip active" data-tag="" onclick="setFilter('')">Tutto</div>
    </div>
    <div id="timeline"></div>
    <div id="input-area">
      <div id="input-row">
        <textarea id="note-input" placeholder="Nuova nota…" rows="1"></textarea>
        <button id="send-btn" onclick="saveNote()">↑</button>
      </div>
      <div id="input-tag-row">
        <span id="input-tag-label">tag:</span>
        <select id="input-tag-select" onchange="updateSubtagSelect()">
          <option value="">—</option>
        </select>
        <select id="input-subtag-select">
          <option value="">—</option>
        </select>
      </div>
    </div>
  </div>

  <!-- TAGS VIEW -->
  <div id="tags-view" style="display:none;"></div>

  <!-- DATA VIEW -->
  <div id="data-view" style="display:none;"></div>

  <div id="nav">
    <button class="nav-btn active" id="nav-timeline" onclick="showView('timeline')">
      <span class="nav-icon">📋</span>Timeline
    </button>
    <button class="nav-btn" id="nav-tags" onclick="showView('tags')">
      <span class="nav-icon">🏷️</span>Tags
    </button>
  </div>
</div>

<!-- MODALS -->
<div class="modal-overlay hidden" id="modal-overlay" onclick="closeModalOutside(event)">
  <div class="modal" id="modal-content"></div>
</div>

<div id="toast"></div>

<script>
// ===================== STATE =====================
let notes = [];
let tags = {}; // { tagName: [subtag1, subtag2] }
let currentView = 'timeline';
let currentFilter = '';
let showArchived = false;
let toastTimer = null;

const STORAGE_KEY = 'mindflow_notes';
const TAGS_KEY = 'mindflow_tags';

// ===================== INIT =====================
function init() {
  loadNotes();
  loadTags();
  ensurePromemoria();
  registerSW();
  setupInput();
  renderAll();
}

function registerSW() {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }
}

function setupInput() {
  const inp = document.getElementById('note-input');
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); saveNote(); }
  });
  inp.addEventListener('input', () => {
    inp.style.height = 'auto';
    inp.style.height = Math.min(inp.scrollHeight, 100) + 'px';
  });
}

// ===================== DATA =====================
function loadNotes() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) notes = JSON.parse(raw);
    if (!Array.isArray(notes)) notes = [];
    notes = notes.filter(n => n && n.id && n.timestamp);
  } catch { notes = []; }
}

function saveNotes() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
}

function loadTags() {
  try {
    const raw = localStorage.getItem(TAGS_KEY);
    if (raw) tags = JSON.parse(raw);
    if (typeof tags !== 'object' || Array.isArray(tags)) tags = {};
  } catch { tags = {}; }
}

function saveTags() {
  localStorage.setItem(TAGS_KEY, JSON.stringify(tags));
}

function ensurePromemoria() {
  if (!tags['PROMEMORIA']) { tags['PROMEMORIA'] = []; saveTags(); }
}

function generateId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function tsToDate(ts) {
  const d = new Date(ts);
  return d.toISOString().slice(0, 10);
}
function tsToMonth(ts) { return tsToDate(ts).slice(0, 7); }

function saveNote() {
  const inp = document.getElementById('note-input');
  const content = inp.value.trim();
  if (!content) return;
  const tag = document.getElementById('input-tag-select').value;
  const subtag = document.getElementById('input-subtag-select').value;
  const now = new Date().toISOString();
  const note = {
    id: generateId(),
    timestamp: now,
    date: tsToDate(now),
    month: tsToMonth(now),
    content,
    tag,
    subtag,
    status: 'active',
    origin: 'generic'
  };
  notes.push(note);
  saveNotes();
  inp.value = '';
  inp.style.height = 'auto';
  renderTimeline();
  scrollToBottom();
}

function scrollToBottom() {
  setTimeout(() => {
    const tl = document.getElementById('timeline');
    tl.scrollTop = tl.scrollHeight;
  }, 50);
}

// ===================== RENDER =====================
function renderAll() {
  renderFilterBar();
  renderTimeline();
  updateTagSelects();
}

function setFilter(tag) {
  currentFilter = tag;
  renderFilterBar();
  renderTimeline();
}

function toggleArchived() {
  showArchived = !showArchived;
  document.getElementById('search-archive-btn').style.color = showArchived ? 'var(--accent2)' : '';
  renderTimeline();
}

function renderFilterBar() {
  const bar = document.getElementById('filter-bar');
  bar.innerHTML = '';
  const allChip = document.createElement('div');
  allChip.className = 'filter-chip' + (currentFilter === '' ? ' active' : '');
  allChip.textContent = 'Tutto';
  allChip.onclick = () => setFilter('');
  bar.appendChild(allChip);

  Object.keys(tags).forEach(t => {
    const chip = document.createElement('div');
    chip.className = 'filter-chip' + (currentFilter === t ? ' active' : '') + (t === 'PROMEMORIA' ? ' promemoria-chip' : '');
    chip.textContent = t;
    chip.onclick = () => setFilter(t);
    bar.appendChild(chip);
  });
}

function getFilteredNotes() {
  return notes.filter(n => {
    if (!showArchived && n.status === 'archived') return false;
    if (currentFilter && n.tag !== currentFilter) return false;
    return true;
  });
}

function renderTimeline() {
  const tl = document.getElementById('timeline');
  const filtered = getFilteredNotes();

  if (filtered.length === 0) {
    tl.innerHTML = '';
    const es = document.createElement('div');
    es.className = 'empty-state';
    es.innerHTML = '<div class="empty-icon">✦</div><div class="empty-text">NESSUNA NOTA\n' + (currentFilter ? 'per questo tag' : 'inizia a scrivere') + '</div>';
    tl.appendChild(es);
    return;
  }

  // Group by month then day
  const byMonth = {};
  filtered.forEach(n => {
    if (!byMonth[n.month]) byMonth[n.month] = {};
    if (!byMonth[n.month][n.date]) byMonth[n.month][n.date] = [];
    byMonth[n.month][n.date].push(n);
  });

  const sortedMonths = Object.keys(byMonth).sort();
  tl.innerHTML = '';

  sortedMonths.forEach(month => {
    const mg = document.createElement('div');
    mg.className = 'month-group';
    mg.dataset.month = month;

    const mh = document.createElement('div');
    mh.className = 'month-header';
    const mLabel = document.createElement('div');
    mLabel.className = 'month-label';
    mLabel.textContent = formatMonth(month);
    const mToggle = document.createElement('div');
    mToggle.className = 'month-toggle';
    mToggle.textContent = '▼';
    mh.appendChild(mLabel);
    mh.appendChild(mToggle);

    const mc = document.createElement('div');
    mc.className = 'month-content';

    mh.onclick = () => {
      mc.classList.toggle('hidden');
      mToggle.classList.toggle('collapsed');
    };

    const sortedDays = Object.keys(byMonth[month]).sort();
    sortedDays.forEach(date => {
      const dg = document.createElement('div');
      dg.className = 'day-group';
      const dh = document.createElement('div');
      dh.className = 'day-header';
      dh.textContent = formatDay(date);
      dg.appendChild(dh);
      const dn = document.createElement('div');
      dn.className = 'day-notes';
      byMonth[month][date].sort((a,b) => a.timestamp > b.timestamp ? 1 : -1).forEach(note => {
        dn.appendChild(buildNoteEl(note));
      });
      dg.appendChild(dn);
      mc.appendChild(dg);
    });

    mg.appendChild(mh);
    mg.appendChild(mc);
    tl.appendChild(mg);
  });

  // Auto-collapse older months
  const allMG = tl.querySelectorAll('.month-group');
  if (allMG.length > 1) {
    for (let i = 0; i < allMG.length - 1; i++) {
      const mc = allMG[i].querySelector('.month-content');
      const mt = allMG[i].querySelector('.month-toggle');
      mc.classList.add('hidden');
      mt.classList.add('collapsed');
    }
  }

  tl.scrollTop = tl.scrollHeight;
}

function buildNoteEl(note) {
  const el = document.createElement('div');
  el.className = 'note-item' +
    (!note.tag ? ' no-tag' : '') +
    (note.status === 'archived' ? ' archived' : '') +
    (note.tag === 'PROMEMORIA' ? ' promemoria-note' : '');

  const meta = document.createElement('div');
  meta.className = 'note-meta';
  const time = document.createElement('div');
  time.className = 'note-time';
  time.textContent = formatTime(note.timestamp);
  meta.appendChild(time);

  if (note.tag) {
    const badge = document.createElement('div');
    badge.className = 'note-tag-badge' + (note.tag === 'PROMEMORIA' ? ' promemoria-badge' : '');
    badge.textContent = note.subtag ? note.tag + ' › ' + note.subtag : note.tag;
    meta.appendChild(badge);
  }

  if (note.status === 'archived') {
    const sb = document.createElement('div');
    sb.className = 'note-status-badge';
    sb.textContent = '[arch]';
    meta.appendChild(sb);
  }

  const content = document.createElement('div');
  content.className = 'note-content';
  content.textContent = note.content;

  el.appendChild(meta);
  el.appendChild(content);
  el.onclick = () => openNoteDetail(note.id);
  return el;
}

function formatMonth(m) {
  const months = ['GENNAIO','FEBBRAIO','MARZO','APRILE','MAGGIO','GIUGNO','LUGLIO','AGOSTO','SETTEMBRE','OTTOBRE','NOVEMBRE','DICEMBRE'];
  const [y, mo] = m.split('-');
  return months[parseInt(mo) - 1] + ' ' + y;
}

function formatDay(d) {
  const days = ['DOM','LUN','MAR','MER','GIO','VEN','SAB'];
  const dt = new Date(d + 'T00:00:00');
  return days[dt.getDay()] + ' ' + dt.getDate().toString().padStart(2, '0') + '.' + (dt.getMonth()+1).toString().padStart(2,'0');
}

function formatTime(ts) {
  const d = new Date(ts);
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}

// ===================== TAGS VIEW =====================
function renderTagsView() {
  const tv = document.getElementById('tags-view');
  tv.innerHTML = '';

  const header = document.createElement('div');
  header.className = 'tags-header';
  const title = document.createElement('div');
  title.className = 'tags-title';
  title.textContent = '// TAGS';
  const addBtn = document.createElement('button');
  addBtn.className = 'add-btn';
  addBtn.textContent = '+ nuovo tag';
  addBtn.onclick = () => openAddTagModal();
  header.appendChild(title);
  header.appendChild(addBtn);
  tv.appendChild(header);

  const tagNames = Object.keys(tags);
  if (tagNames.length === 0) {
    const es = document.createElement('div');
    es.className = 'empty-state';
    es.innerHTML = '<div class="empty-icon">🏷️</div><div class="empty-text">NESSUN TAG\ncrea il primo</div>';
    tv.appendChild(es);

  tagNames.forEach(tagName => {

function buildTagCard(tagName) {
  const isPromo = tagName === 'PROMEMORIA';
  const card = document.createElement('div');
  card.className = 'tag-card';

  const noteCount = notes.filter(n => n.tag === tagName && n.status === 'active').length;
  const subtags = tags[tagName] || [];

  const ch = document.createElement('div');
  ch.className = 'tag-card-header';

  const nameEl = document.createElement('div');
  nameEl.className = 'tag-card-name' + (isPromo ? ' promemoria-name' : '');
  nameEl.textContent = isPromo ? '⏰ ' + tagName : tagName;

  const countEl = document.createElement('div');
  countEl.className = 'tag-count';
  countEl.textContent = noteCount;

  const filterBtn = document.createElement('button');
  filterBtn.className = 'icon-btn';
  filterBtn.style.fontSize = '14px';
  filterBtn.textContent = '→';
  filterBtn.title = 'Filtra';
  filterBtn.onclick = (e) => { e.stopPropagation(); setFilter(tagName); showView('timeline'); };

  ch.appendChild(nameEl);
  ch.appendChild(countEl);
  ch.appendChild(filterBtn);

  if (!isPromo) {
    const delBtn = document.createElement('button');
    delBtn.className = 'tag-del-btn';
    delBtn.textContent = '✕';
    delBtn.onclick = (e) => { e.stopPropagation(); confirmDeleteTag(tagName); };
    ch.appendChild(delBtn);
  }

  const sa = document.createElement('div');
  sa.className = 'subtags-area';
  sa.style.display = 'none';

  ch.onclick = () => { sa.style.display = sa.style.display === 'none' ? 'flex' : 'none'; };

  subtags.forEach(sub => {
    const sr = document.createElement('div');
    sr.className = 'subtag-row';
    const dot = document.createElement('div');
    dot.className = 'subtag-dot';
    const sn = document.createElement('div');
    sn.className = 'subtag-name';
    sn.textContent = sub;
    const sd = document.createElement('button');
    sd.className = 'subtag-del';
    sd.textContent = '✕';
    sd.onclick = (e) => { e.stopPropagation(); deleteSubtag(tagName, sub); };
    sr.appendChild(dot); sr.appendChild(sn); sr.appendChild(sd);
    sa.appendChild(sr);
  });

  const addSub = document.createElement('button');
  addSub.className = 'add-subtag-btn';
  addSub.textContent = '+ subtag';
  addSub.onclick = (e) => { e.stopPropagation(); openAddSubtagModal(tagName); };
  sa.appendChild(addSub);

  card.appendChild(ch);
  card.appendChild(sa);
  return card;
}

function confirmDeleteTag(tagName) {
  const count = notes.filter(n => n.tag === tagName).length;
  openModal(`
    <div class="modal-title">ELIMINA TAG</div>
    <div style="font-family:var(--font-main);font-size:13px;color:var(--text2);margin-bottom:16px;">
      Elimina "${tagName}"?<br>
      ${count > 0 ? `<span style="color:var(--warn)">${count} note perderanno il tag</span>` : 'Nessuna nota associata.'}
    </div>
    <div class="modal-actions">
      <button class="modal-btn secondary" onclick="closeModal()">Annulla</button>
      <button class="modal-btn danger" onclick="deleteTag('${tagName}')">Elimina</button>
    </div>
  `);
}

function deleteTag(tagName) {
  delete tags[tagName];
  saveTags();
  notes.forEach(n => { if (n.tag === tagName) { n.tag = ''; n.subtag = ''; } });
  saveNotes();
  closeModal();
  renderTagsView();
  renderAll();
  toast('Tag eliminato');
}

function deleteSubtag(tagName, sub) {
  tags[tagName] = tags[tagName].filter(s => s !== sub);
  saveTags();
  notes.forEach(n => { if (n.tag === tagName && n.subtag === sub) n.subtag = ''; });
  saveNotes();
  renderTagsView();
  updateTagSelects();
  toast('Subtag eliminato');
}

function openModal(html) {
  const overlay = document.getElementById('modal-overlay');
  const content = document.getElementById('modal-content');
  overlay.classList.remove('hidden');
  content.innerHTML = html;
  const firstInput = content.querySelector('input, textarea');
  if (firstInput) setTimeout(() => firstInput.focus(), 100);
}

function closeModal() {
  document.getElementById('modal-overlay').classList.add('hidden');
}

function closeModalOutside(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
}

function openAddTagModal() {
  openModal(`
    <div class="modal-title">NUOVO TAG</div>
    <input class="modal-input" id="new-tag-input" placeholder="Nome tag…" maxlength="30">
    <div class="modal-actions">
      <button class="modal-btn secondary" onclick="closeModal()">Annulla</button>
      <button class="modal-btn primary" onclick="addTag()">Crea</button>
    </div>
  `);
  document.getElementById('new-tag-input').onkeydown = e => { if (e.key === 'Enter') addTag(); };
}

function addTag() {
  const val = document.getElementById('new-tag-input').value.trim().toUpperCase();
  if (!val) return;
  if (tags[val]) { toast('Tag già esistente'); return; }
  tags[val] = [];
  saveTags();
  closeModal();
  renderTagsView();
  renderAll();
  toast('Tag creato: ' + val);
}

function openAddSubtagModal(tagName) {
  openModal(`
    <div class="modal-title">NUOVO SUBTAG — ${tagName}</div>
    <input class="modal-input" id="new-subtag-input" placeholder="Nome subtag…" maxlength="30">
    <div class="modal-actions">
      <button class="modal-btn secondary" onclick="closeModal()">Annulla</button>
      <button class="modal-btn primary" onclick="addSubtag('${tagName}')">Crea</button>
    </div>
  `);
  document.getElementById('new-subtag-input').onkeydown = e => { if (e.key === 'Enter') addSubtag(tagName); };
}

function addSubtag(tagName) {
  const val = document.getElementById('new-subtag-input').value.trim();
  if (!val) return;
  if (!tags[tagName]) tags[tagName] = [];
  if (tags[tagName].includes(val)) { toast('Subtag già presente'); return; }
  tags[tagName].push(val);
  saveTags();
  closeModal();
  renderTagsView();
  updateTagSelects();
  toast('Subtag aggiunto');
}

function openNoteDetail(id) {
  const note = notes.find(n => n.id === id);
  if (!note) return;
  const tagOpts = Object.keys(tags).map(t => `<option value="${t}" ${note.tag === t ? 'selected' : ''}>${t}</option>`).join('');
  const subtagOpts = (tags[note.tag] || []).map(s => `<option value="${s}" ${note.subtag === s ? 'selected' : ''}>${s}</option>`).join('');
  const isArchived = note.status === 'archived';

  openModal(`
    <div class="modal-title">${formatDay(note.date)} — ${formatTime(note.timestamp)}</div>
    <div class="note-detail-content" id="detail-content" contenteditable="true" spellcheck="false">${escapeHtml(note.content)}</div>
    <div class="modal-section">
      <div class="modal-label">TAG</div>
      <select class="modal-select" id="detail-tag" onchange="updateDetailSubtag('${id}')">
        <option value="">— nessuno —</option>
        ${tagOpts}
      </select>
    </div>
    <div class="modal-section" id="detail-subtag-section" style="${note.tag ? '' : 'display:none'}">
      <div class="modal-label">SUBTAG</div>
      <select class="modal-select" id="detail-subtag">
        <option value="">— nessuno —</option>
        ${subtagOpts}
      </select>
    </div>
    <div class="modal-actions">
      <button class="modal-btn secondary" onclick="closeModal()">Chiudi</button>
      <button class="modal-btn ${isArchived ? 'secondary' : 'secondary'}" onclick="toggleArchive('${id}')">${isArchived ? '↩ Ripristina' : '📁 Archivia'}</button>
      <button class="modal-btn primary" onclick="updateNote('${id}')">Salva</button>
    </div>
    <div style="margin-top:10px">
      <button class="modal-btn danger" onclick="deleteNote('${id}')">🗑️ Elimina</button>
    </div>

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function updateDetailSubtag(id) {
  const note = notes.find(n => n.id === id);
  const tagSel = document.getElementById('detail-tag');
  const subSec = document.getElementById('detail-subtag-section');
  const subSel = document.getElementById('detail-subtag');

  if (newTag) {

function updateNote(id) {

function toggleArchive(id) {

// ===================== CSV =====================
function exportCSV() {
  const header = 'timestamp,date,month,content,tag,subtag,status,origin';
  const rows = notes.map(n => {
    const fields = [n.timestamp, n.date, n.month, n.content, n.tag || '', n.subtag || '', n.status, n.origin || 'generic'];
    return fields.map(f => {
      const s = String(f);
      if (s.includes(',') || s.includes('"') || s.includes('\n')) return '"' + s.replace(/"/g, '""') + '"';
      return s;
    }).join(',');
  });
  const csv = [header, ...rows].join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'mindflow_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  URL.revokeObjectURL(url);
  toast('CSV esportato');
}

function importCSV() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.csv,text/csv';
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const text = ev.target.result;
      const imported = parseCSV(text);
      let added = 0;
      imported.forEach(n => {
        const dup = notes.find(existing => existing.timestamp === n.timestamp && existing.content === n.content);
        if (!dup) { notes.push(n); added++; }
      });
      saveNotes();
      renderAll();
      toast(`Importate ${added} note`);
    };
    reader.readAsText(file);
  };
  input.click();
}

function parseCSV(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(l => l);
  if (lines.length < 2) return [];
  const headerLine = lines[0];
  const headers = parseCSVRow(headerLine);
  const isOldFormat = headers.length === 2 && headers[0] === 'timestamp' && headers[1] === 'content';
  const results = [];

  for (let i = 1; i < lines.length; i++) {
    const cols = parseCSVRow(lines[i]);
    if (!cols.length) continue;
    let note = {};
    if (isOldFormat) {
      note.timestamp = cols[0] || '';
      note.content = cols[1] || '';
      note.tag = ''; note.subtag = '';
      note.status = 'active'; note.origin = 'imported';
    } else {
      headers.forEach((h, idx) => { note[h] = cols[idx] || ''; });
      note.origin = note.origin || 'imported';
      note.status = note.status || 'active';
    }
    if (!note.timestamp || !note.content) continue;
    note.id = note.id || generateId();
    note.date = note.date || tsToDate(note.timestamp);
    note.month = note.month || tsToMonth(note.timestamp);
    results.push(note);
  }
  return results;
}

function parseCSVRow(line) {
  const result = [];
  let cur = ''; let inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') {
      if (inQ && line[i+1] === '"') { cur += '"'; i++; }
      else { inQ = !inQ; }
    } else if (c === ',' && !inQ) {
      result.push(cur); cur = '';
    } else { cur += c; }
  }
  result.push(cur);
  return result;
}

// ===================== VIEW SWITCHING =====================
function showView(view) {
  currentView = view;
  const tv = document.getElementById('timeline-view');
  const tagsV = document.getElementById('tags-view');
  const dataV = document.getElementById('data-view');

  tv.style.display = 'none';
  tagsV.style.display = 'none';
  dataV.style.display = 'none';

  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

  if (view === 'timeline') {
    tv.style.display = 'flex';
    document.getElementById('nav-timeline').classList.add('active');
    renderTimeline();
    setTimeout(scrollToBottom, 100);
  } else if (view === 'tags') {
    tagsV.style.display = 'flex';
    tagsV.style.flexDirection = 'column';
    document.getElementById('nav-tags').classList.add('active');
    renderTagsView();
  } else if (view === 'data') {
    dataV.style.display = 'flex';
    dataV.style.flexDirection = 'column';
    renderDataView();
  }
}

// ===================== TOAST =====================
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}

(function injectManifest() {

    name: 'MindFlow Local',

      { src: 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' fill='%230a0a0f'/><text x='256' y='350' font-size='280' text-anchor='middle' fill='%237c6af7'>✦</text></svg>`), sizes: '512x512', type: 'image/svg+xml' }
